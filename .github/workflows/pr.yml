name: PR

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  title:
    name: Conventional title
    runs-on: ubuntu-latest
    steps:
      - name: Check the PR title follows Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|docs|test|build|ci|refactor|perf|style|chore|revert)(\([a-z0-9/_-]+\))?!?: .+'
          if ! printf '%s\n' "$TITLE" | grep -Eq "$re"; then
            echo "::error::PR title must follow Conventional Commits, e.g. 'fix(cli): ...'. Got: $TITLE"
            exit 1
          fi

  commits:
    name: Conventional commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check every commit message follows Conventional Commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          re='^(feat|fix|docs|test|build|ci|refactor|perf|style|chore|revert)(\([a-z0-9/_-]+\))?!?: .+'
          bad=0
          while IFS= read -r line; do
            sha=${line%% *} subject=${line#* }
            if ! printf '%s\n' "$subject" | grep -Eq "$re"; then
              echo "::error::$sha: '$subject' does not follow Conventional Commits"
              bad=1
            fi
          done < <(git log --no-merges --format='%h %s' "$BASE..$HEAD")
          exit $bad
